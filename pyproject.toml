[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "biodex"
version = "0.4.0"
description = "Local, privacy-first AI for wildlife camera trap analysis"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
authors = [{ name = "FratresMedAI" }]
keywords = ["camera-trap", "wildlife", "megadetector", "speciesnet", "conservation"]
dependencies = [
    "gradio>=5.0,<7.0",
    "megadetector>=10.0,<11.0",
    "speciesnet>=5.0,<6.0",
    "torch>=2.0",
    "Pillow>=9.5",
    "numpy>=1.26.4,<2.0",
    "pandas>=2.1",
    "onnx>=1.17.0,<1.22.0",
    "setuptools>=65.0,<81.0",
    "tqdm>=4.64",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-Pillow",
]
cli = [
    "typer>=0.12",
    "tqdm>=4.64",
]

[project.scripts]
biodex = "core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["core", "ui"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["core", "ui", "scripts", "tests", "app.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["B008", "SIM117", "I001"]
"core/cli.py" = ["B008"]
"core/exports.py" = ["SIM115"]
"core/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
files = ["core"]

[[tool.mypy.overrides]]
module = [
    "megadetector.*",
    "speciesnet.*",
    "gradio.*",
    "yolov5.*",
    "pandas.*",
    "tqdm.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "core.visualization"
disable_error_code = ["arg-type"]
