[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "biodex"
dynamic = ["version"]
description = "Local, privacy-first AI for wildlife camera trap analysis and conservation monitoring"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
authors = [{ name = "FratresMedAI" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
keywords = [
    "camera-trap",
    "wildlife",
    "megadetector",
    "speciesnet",
    "conservation",
    "defensive-monitoring",
    "biodiversity",
    "wildlife-insights",
]
dependencies = [
    "Pillow>=9.5",
    "numpy>=1.26.4,<2.0",
    "pandas>=2.1",
    "setuptools>=65.0,<81.0",
    "tqdm>=4.64",
    "typer>=0.12",
]

[project.optional-dependencies]
ui = [
    "gradio>=5.0,<7.0",
]
models = [
    "megadetector>=10.0,<11.0",
    "speciesnet>=5.0,<6.0",
    "torch>=2.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-Pillow",
]
desktop = [
    "pyinstaller>=6.0",
]
video = [
    "opencv-python-headless>=4.8",
]
analytics = [
    "matplotlib>=3.7",
    "seaborn>=0.13",
]
edge = [
    "onnxruntime>=1.16; platform_system != 'Darwin' or platform_machine != 'arm64'",
]
all = [
    "gradio>=5.0,<7.0",
    "megadetector>=10.0,<11.0",
    "speciesnet>=5.0,<6.0",
    "torch>=2.0",
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-Pillow",
    "pyinstaller>=6.0",
    "opencv-python-headless>=4.8",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "onnxruntime>=1.16",
]

[project.scripts]
biodex = "core.cli:main"
biodex-ui = "core.ui_entry:main"
biodex-desktop = "desktop.launcher:main"

[tool.hatch.version]
path = "core/types.py"
pattern = "BIODEX_VERSION = \"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
packages = ["biodex", "core", "ui", "desktop"]

[tool.hatch.build.targets.wheel.force-include]
"app.py" = "app.py"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["core", "ui", "desktop", "scripts", "tests", "app.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["B008", "SIM117"]
"core/cli.py" = ["B008"]
"core/exports.py" = ["SIM115"]
"core/__init__.py" = ["F401"]
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
files = ["biodex", "core", "app.py", "ui", "tests"]

[[tool.mypy.overrides]]
module = [
    "megadetector.*",
    "speciesnet.*",
    "gradio.*",
    "yolov5.*",
    "pandas.*",
    "tqdm.*",
    "typer.*",
    "torch",
    "torch.*",
    "onnxruntime",
    "onnxruntime.*",
    "cv2",
    "cv2.*",
    "matplotlib",
    "matplotlib.*",
    "seaborn",
    "seaborn.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "core.visualization"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = "scripts.*"
disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = "desktop.*"
disallow_untyped_defs = false
